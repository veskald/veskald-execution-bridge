# Veskald Execution Bridge — GitLab CI pipeline.
#
# CI scope: only the multi-arch Docker image is built and pushed to the
# GitLab Container Registry. Desktop apps (Windows / macOS / Linux) are
# built locally by the maintainer and pushed to S3 via
# `installer/build-local.sh --deploy` (or .ps1 -Deploy).

stages:
  - validate
  - docker
  - release

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  GIT_DEPTH: "0"

default:
  interruptible: true

# ────────────────────────────────────────────────────────────────────
# Authorization gate
# Only allowed GitLab users can trigger a release pipeline.
# ────────────────────────────────────────────────────────────────────
authorize:
  stage: validate
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    ALLOWED_USERS: "vvoloshchuk777"
  script:
    - |
      if ! echo " $ALLOWED_USERS " | grep -q " $GITLAB_USER_LOGIN "; then
        echo "ERROR: $GITLAB_USER_LOGIN is not authorized to trigger releases."
        echo "Allowed users: $ALLOWED_USERS"
        exit 1
      fi
      echo "OK: $GITLAB_USER_LOGIN is authorized"

# ────────────────────────────────────────────────────────────────────
# MR title check (Conventional Commits)
# Runs on every MR open/update. Blocks merge when the title doesn't
# match the type:capitalized-subject format.
# ────────────────────────────────────────────────────────────────────
mr-title:
  stage: validate
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      TITLE="$CI_MERGE_REQUEST_TITLE"
      PATTERN='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([^)]+\))?: [A-Z].+'
      echo "MR title: $TITLE"
      if echo "$TITLE" | grep -qE "$PATTERN"; then
        echo "OK: Conventional Commits format"
        exit 0
      fi
      cat <<'EOF'

      ERROR: MR title does not match Conventional Commits.

      Required format:
        type: Subject in imperative mood, capitalized

      Allowed types: feat fix perf refactor docs test build ci chore revert

      Examples:
        feat: Add Bybit testnet toggle in settings dialog
        fix:  Reconnect socket after MACHINE token rotation
        chore: Bump pybit to 5.16.0

      EOF
      exit 1

# ────────────────────────────────────────────────────────────────────
# Docker multi-arch build → GitLab Container Registry
# Tags:  :<version>   always
#        :latest      only for non-prerelease (no '-' in tag)
# ────────────────────────────────────────────────────────────────────
docker:build-push:
  stage: docker
  needs: [authorize]
  image: docker:24
  services:
    - docker:24-dind
  timeout: 30m
  # Shared runners drop the dind network mid-push now and then ("zombie
  # container disconnected"), which surfaces as "blob unknown to registry".
  retry: 1
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install all
    # buildx in DinD+TLS needs a named docker context — it refuses to consume
    # DOCKER_HOST/DOCKER_TLS_CERTDIR straight from env.
    - docker context create tls-env
    - docker buildx create --use --name builder tls-env
  script:
    - |
      EXTRA_TAGS=""
      if ! echo "$CI_COMMIT_TAG" | grep -q '-'; then
        EXTRA_TAGS="-t $IMAGE:latest"
      fi
      # No provenance/SBOM attestations: GitLab's container registry rejects
      # manifests that reference them with "blob unknown to registry".
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --provenance=false \
        --sbom=false \
        -t "$IMAGE:$CI_COMMIT_TAG" \
        $EXTRA_TAGS \
        --push \
        .
    - echo "Pushed $IMAGE:$CI_COMMIT_TAG$( [ -n "$EXTRA_TAGS" ] && echo ' + :latest')"

# ────────────────────────────────────────────────────────────────────
# GitLab Release — attaches per-OS desktop builds as asset links.
#
# Prerequisite: before pushing the tag, the maintainer must have run
# `installer/build-local.sh --deploy` (Linux + macOS) and
# `installer/build-local.ps1 -Deploy` (Windows) so that the binaries
# already live at https://$AWS_DOWNLOADS_BASE_URL/$S3_PREFIX/$TAG/.
#
# Configure in CI/CD → Variables:
#   AWS_DOWNLOADS_BASE_URL   e.g. https://downloads.veskald.com
#   S3_PREFIX                e.g. execution-bridge/releases
#   MACOS_ARCH_TAG           one of: arm64 | x86_64 | universal2  (default: universal2)
# ────────────────────────────────────────────────────────────────────
release:create:
  stage: release
  needs: [docker:build-push]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  variables:
    S3_PREFIX: "execution-bridge/releases"
  script:
    - |
      : "${AWS_DOWNLOADS_BASE_URL:?set AWS_DOWNLOADS_BASE_URL in CI/CD variables}"
      # Every package gets two links: the immutable per-tag snapshot and the
      # rolling latest/ mirror. Not every tag ships a fresh build for every
      # OS, so a versioned URL can 404 for an OS skipped this cycle —
      # latest/ always carries the most recent deployed binary per OS.
      BASE_TAG="$AWS_DOWNLOADS_BASE_URL/$S3_PREFIX/$CI_COMMIT_TAG"
      BASE_LATEST="$AWS_DOWNLOADS_BASE_URL/$S3_PREFIX/latest"
      P="Veskald-Execution-Bridge"
      LINUX_TAR="$P-linux-x86_64.tar.gz"
      LINUX_TAR_V="$P-$CI_COMMIT_TAG-linux-x86_64.tar.gz"
      LINUX_INSTALLER="$P-linux-x86_64-installer.tar.gz"
      LINUX_INSTALLER_V="$P-$CI_COMMIT_TAG-linux-x86_64-installer.tar.gz"
      MACOS_TAR="$P-macos-arm64.tar.gz"
      MACOS_TAR_V="$P-$CI_COMMIT_TAG-macos-arm64.tar.gz"
      WINDOWS_ZIP="$P-windows-x86_64.zip"
      WINDOWS_ZIP_V="$P-$CI_COMMIT_TAG-windows-x86_64.zip"
      echo "Creating GitLab Release for $CI_COMMIT_TAG with assets at $BASE_TAG/ and $BASE_LATEST/"
      release-cli create \
        --name "Veskald Execution Bridge $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "Desktop binaries for Linux, macOS, and Windows. Docker image: \`$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG\`. Links marked $CI_COMMIT_TAG are immutable snapshots of this release (an OS not rebuilt this cycle returns 404/AccessDenied — use latest); links marked latest always serve the newest deployed build per OS." \
        --assets-link "{\"name\":\"Linux — tar.gz (preserves +x) — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$LINUX_TAR_V\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux — tar.gz (preserves +x) — latest\",\"url\":\"$BASE_LATEST/$LINUX_TAR\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux — installer bundle — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$LINUX_INSTALLER_V\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Linux — installer bundle — latest\",\"url\":\"$BASE_LATEST/$LINUX_INSTALLER\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"macOS (arm64) — .app.tar.gz — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$MACOS_TAR_V\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"macOS (arm64) — .app.tar.gz — latest\",\"url\":\"$BASE_LATEST/$MACOS_TAR\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Windows — zip — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$WINDOWS_ZIP_V\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"Windows — zip — latest\",\"url\":\"$BASE_LATEST/$WINDOWS_ZIP\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"SHA-256 — Linux tar.gz — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$LINUX_TAR_V.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — Linux tar.gz — latest\",\"url\":\"$BASE_LATEST/$LINUX_TAR.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — Linux installer — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$LINUX_INSTALLER_V.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — Linux installer — latest\",\"url\":\"$BASE_LATEST/$LINUX_INSTALLER.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — macOS — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$MACOS_TAR_V.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — macOS — latest\",\"url\":\"$BASE_LATEST/$MACOS_TAR.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — Windows — $CI_COMMIT_TAG\",\"url\":\"$BASE_TAG/$WINDOWS_ZIP_V.sha256\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"SHA-256 — Windows — latest\",\"url\":\"$BASE_LATEST/$WINDOWS_ZIP.sha256\",\"link_type\":\"other\"}"
